version: "3.9"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: vitals-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vitals-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: vitals-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command: |
      -c "
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
        --topic vitals.raw --partitions 6 --replication-factor 1 \
        --config retention.ms=259200000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
        --topic vitals.scored --partitions 6 --replication-factor 1 \
        --config retention.ms=604800000
      kafka-topics --create --if-not-exists --bootstrap-server kafka:9092 \
        --topic vitals.alerts --partitions 3 --replication-factor 1 \
        --config retention.ms=2592000000
      echo 'Topics created successfully'
      "

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: vitals-timescaledb
    environment:
      POSTGRES_USER: ${TIMESCALE_USER:-vitals}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-vitals_dev}
      POSTGRES_DB: ${TIMESCALE_DB:-patient_vitals}
    ports:
      - "${TIMESCALE_PORT:-5432}:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-vitals}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vitals-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vitals-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vitals-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  tsdata:
