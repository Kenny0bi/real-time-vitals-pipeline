name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # CI installs only what the unit tests exercise; the full
        # requirements.txt (Spark, GE, dbt) is for a running deployment
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas fastapi httpx "uvicorn[standard]" \
            pydantic pydantic-settings click loguru redis \
            pytest pytest-asyncio pytest-cov ruff

      - name: Lint
        run: ruff check src/ tests/

      - name: Unit tests
        run: |
          pytest tests/unit -v --tb=short \
            --junitxml=test-report-${{ matrix.python-version }}.xml \
            --cov=src --cov-report=term

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.python-version }}
          path: test-report-${{ matrix.python-version }}.xml
